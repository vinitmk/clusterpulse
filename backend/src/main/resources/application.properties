spring.application.name=backend

# CPU thresholds
simulator.metrics.cpu.min=10.0
simulator.metrics.cpu.max=95.0

# Memory thresholds
simulator.metrics.memory.min=40.0
simulator.metrics.memory.max=90.0

# Latency thresholds - normal range
simulator.metrics.latency.normal.min=5.0
simulator.metrics.latency.normal.max=50.0

# Latency thresholds - spike range
simulator.metrics.latency.spike.min=200.0
simulator.metrics.latency.spike.max=500.0
# Server port
server.port=8080

# Simulator configuration
simulator.metrics.interval=5000
simulator.metrics.node-count=5
simulator.metrics.spike-probability=0.1

# CORS configuration for frontend (React, running on localhost:3000)
cors.allowed-origins=http://localhost:3000

# Spring Datasource configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://timescaledb:5432/clusterpulse
spring.datasource.username=clusterpulse
spring.datasource.password=clusterpulse
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Flyway migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG