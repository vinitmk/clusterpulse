spring.application.name=backend

# CPU thresholds
simulator.metrics.cpu.min=10.0
simulator.metrics.cpu.max=95.0

# Memory thresholds
simulator.metrics.memory.min=40.0
simulator.metrics.memory.max=90.0

# Latency thresholds - normal range
simulator.metrics.latency.normal.min=5.0
simulator.metrics.latency.normal.max=50.0

# Latency thresholds - spike range
simulator.metrics.latency.spike.min=200.0
simulator.metrics.latency.spike.max=500.0

# Server port
server.port=8080

# Simulator configuration
simulator.metrics.interval=5000
simulator.metrics.node-count=5
simulator.metrics.spike-probability=0.1

# CORS configuration for frontend (React, running on localhost:3000)
cors.allowed-origins=http://localhost:3000

# Anthropic Claude API
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-haiku-4-5-20251001

# Spring Datasource configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clusterpulse
spring.datasource.username=clusterpulse
spring.datasource.password=clusterpulse
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Skip JPA/Hibernate initialization if no DB available
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Flyway migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Alerts
alert.cpu.threshold=85.0
alert.latency.threshold=300.0
alert.cooldown.minutes=100
alert.recipient=${MAIL_USERNAME:}